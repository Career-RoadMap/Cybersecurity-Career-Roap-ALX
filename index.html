<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALX Cybersecurity Career & Resources Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            overflow-x: hidden;
            background-color: #f8fafc;
        }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Watermark Background */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            opacity: 0.05;
            z-index: -10;
            width: 60vw;
            pointer-events: none;
            filter: grayscale(100%);
        }

        .tab-content { min-height: 600px; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #002b56; border-radius: 10px; }
        
        .role-content {
            transition: max-height 0.3s ease-out, opacity 0.2s ease-in;
            overflow: hidden;
        }

        .standard-card:hover {
            border-color: #05F283;
            transform: translateY(-2px);
        }

        .quiz-option:hover {
            border-color: #002b56;
            background-color: #f1f5f9;
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #564887; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-900">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        /**
         * Robust Icon Component
         * Prevents removeChild errors during state transitions by wrapping in a stable span
         */
        const Icon = ({ name, size = 18, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    window.lucide.createIcons({
                        node: iconRef.current
                    });
                }
            }, [name]);

            return (
                <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`}>
                    <i data-lucide={name} style={{ width: size, height: size }}></i>
                </span>
            );
        };

        const RoleItem = ({ title, desc }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="border-b border-slate-100 last:border-0">
                    <button 
                        onClick={() => setIsOpen(!isOpen)}
                        className="w-full flex items-center justify-between py-3 group text-left hover:bg-slate-50/80 px-3 rounded-lg transition-all"
                    >
                        <div className="flex items-center gap-3">
                            <div className={`w-1.5 h-1.5 rounded-full transition-all duration-300 ${isOpen ? 'bg-emerald-400 scale-150' : 'bg-slate-300'}`} />
                            <span className={`text-xs md:text-sm font-semibold transition-colors ${isOpen ? 'text-[#002b56]' : 'text-slate-600'}`}>{title}</span>
                        </div>
                        <Icon name={isOpen ? "minus" : "plus"} size={14} className="text-slate-400" />
                    </button>
                    <div className={`role-content ${isOpen ? 'max-h-60 opacity-100 mb-4' : 'max-h-0 opacity-0'}`}>
                        <div className="ml-7 mr-2 p-3 bg-white rounded-lg border-l-4 border-[#05F283] shadow-sm">
                            <p className="text-[11px] md:text-xs text-slate-500 leading-relaxed italic">
                                {desc}
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        const PathfinderQuiz = () => {
            const [step, setStep] = useState(0);
            const [scores, setScores] = useState({ D: 0, O: 0, S: 0 });
            const [result, setResult] = useState(null);

            const questions = [
                {
                    q: "When you find a locked door, what is your first instinct?",
                    options: [
                        { text: "Check the cameras and strengthen the lock.", type: "D" },
                        { text: "Try to find a way to pick the lock or find a key.", type: "O" },
                        { text: "Check the building's insurance and safety policies.", type: "S" }
                    ]
                },
                {
                    q: "What was your favorite lab activity?",
                    options: [
                        { text: "Analyzing logs and stopping simulated attacks.", type: "D" },
                        { text: "Breaking into Active Directory and stealing hashes.", type: "O" },
                        { text: "Reviewing GDPR laws and drafting policies.", type: "S" }
                    ]
                },
                {
                    q: "How do you prefer to spend your work day?",
                    options: [
                        { text: "Investigating puzzles and keeping things stable.", type: "D" },
                        { text: "Exploring unknown systems and finding flaws.", type: "O" },
                        { text: "Strategic planning and ensuring legal compliance.", type: "S" }
                    ]
                }
            ];

            const handleAnswer = (type) => {
                const newScores = { ...scores, [type]: scores[type] + 1 };
                setScores(newScores);
                if (step < questions.length - 1) {
                    setStep(step + 1);
                } else {
                    const top = Object.keys(newScores).reduce((a, b) => newScores[a] > newScores[b] ? a : b);
                    setResult(top);
                }
            };

            const resetQuiz = () => {
                setScores({ D: 0, O: 0, S: 0 });
                setResult(null);
                setStep(0);
            };

            if (result) {
                return (
                    <div key="quiz-result" className="bg-[#002b56] text-white p-8 rounded-3xl text-center animate-in shadow-xl">
                        <Icon name="award" size={48} className="mx-auto mb-4 text-[#05F283]" />
                        <h3 className="text-xl font-bold mb-2">Recommended Path: 
                            {result === 'D' ? ' Defensive (Blue Team)' : result === 'O' ? ' Offensive (Red Team)' : ' Strategic (GRC/DPO)'}
                        </h3>
                        <p className="text-slate-300 text-xs mb-6">Based on your instincts, you belong in {result === 'D' ? 'the SOC' : result === 'O' ? 'Penetration Testing' : 'Compliance Management'}.</p>
                        <button onClick={resetQuiz} className="text-xs font-bold text-[#05F283] underline uppercase tracking-widest hover:text-white transition-colors">Restart Quiz</button>
                    </div>
                );
            }

            return (
                <div key={`quiz-step-${step}`} className="bg-white p-6 rounded-3xl shadow-md border border-slate-100 animate-in">
                    <div className="flex justify-between items-center mb-4">
                        <h3 className="font-bold text-[#002b56] text-sm">Pathfinder Quiz</h3>
                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Q {step + 1} of 3</span>
                    </div>
                    <p className="text-xs font-medium text-slate-700 mb-4">{questions[step].q}</p>
                    <div className="space-y-2">
                        {questions[step].options.map((opt, i) => (
                            <button 
                                key={i} 
                                onClick={() => handleAnswer(opt.type)}
                                className="w-full text-left p-3 border border-slate-200 rounded-xl text-xs font-semibold text-slate-600 transition-all quiz-option"
                            >
                                {opt.text}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('map');

            const careerData = [
                {
                    level: "Level 1: Entry (0-2 Years)",
                    desc: "Foundational Operations",
                    tracks: [
                        {
                            name: "Defensive", icon: "shield", color: "border-[#27DEF2]",
                            roles: [
                                { title: "Junior SOC Analyst", desc: "Monitors dashboards for potential threats. Performs initial alert triage (Real vs False Positive)." },
                                { title: "Email Security Analyst", desc: "Digital Gatekeeper. Performs header forensics to detect spoofing and phishing." },
                                { title: "IAM Provisioner", desc: "Access Rights Manager. Ensures proper permissions in Active Directory." }
                            ],
                            certs: "Security+, BTL1"
                        },
                        {
                            name: "Offensive", icon: "zap", color: "border-[#FF5347]",
                            roles: [
                                { title: "Junior PenTester", desc: "The Scout. Conducts authorized network scans to identify open doors." },
                                { title: "OSINT Researcher", desc: "Information Gatherer. Mines public data to find leaked organizational secrets." },
                                { title: "Vulnerability Scout", desc: "Runs automated scanners (Nessus/OpenVAS) to find missing patches." }
                            ],
                            certs: "eJPT, PenTest+"
                        },
                        {
                            name: "Strategic", icon: "scale", color: "border-[#564887]",
                            roles: [
                                { title: "GRC Analyst", desc: "Compliance Auditor. Ensures company policy follows legal standards like GDPR or NDPR." },
                                { title: "Technical Policy Writer", desc: "Translates complex technical security into readable employee handbooks." }
                            ],
                            certs: "Sec+, ITCA"
                        }
                    ]
                },
                {
                    level: "Level 2: Intermediate (2-5 Years)",
                    desc: "Technical Mastery",
                    tracks: [
                        {
                            name: "Defensive", icon: "activity", color: "border-[#27DEF2]",
                            roles: [
                                { title: "Malware Analyst", desc: "Reverse Engineers code in sandboxes to block malicious payloads." },
                                { title: "Incident Responder", desc: "The Firefighter. Executes rapid containment to stop breaches in progress." },
                                { title: "Forensics Investigator", desc: "Digital Detective. Performs autopsies on disks and RAM to extract evidence." }
                            ],
                            certs: "CySA+, GCIH"
                        },
                        {
                            name: "Offensive", icon: "target", color: "border-[#FF5347]",
                            roles: [
                                { title: "Ethical Hacker", desc: "The Infiltrator. Simulates attacks to prove technical risk to business owners." },
                                { title: "API Security Tester", desc: "Secures the communication lines between mobile and web applications." }
                            ],
                            certs: "OSCP, PNPT"
                        },
                        {
                            name: "Specialized", icon: "brain", color: "border-[#05F283]",
                            roles: [
                                { title: "AI Security Engineer", desc: "Protects machine learning models from prompt injection and data poisoning." },
                                { title: "Data Privacy Officer (DPO)", desc: "Legal Guardian of user data. Manages compliance for high-stakes industries." }
                            ],
                            certs: "CIPP, AI-102"
                        }
                    ]
                }
            ];

            const toolkit = {
                "Technical Tools": [
                    { name: "Wireshark", category: "Network", desc: "Deep packet analysis for protocol troubleshooting.", url: "https://www.wireshark.org/" },
                    { name: "Nmap", category: "Recon", desc: "The standard for network mapping and discovery.", url: "https://nmap.org/" },
                    { name: "Recon-ng", category: "OSINT", desc: "Modular framework for automated intelligence gathering.", url: "https://github.com/lanmaster53/recon-ng" },
                    { name: "Burp Suite", category: "Web", desc: "Interception proxy for testing web vulnerabilities.", url: "https://portswigger.net/burp" }
                ],
                "Industry Frameworks": [
                    { name: "NIST SP 800-53", category: "Framework", desc: "Standard controls for federal and enterprise infra.", url: "https://csrc.nist.gov/publications/sp800" },
                    { name: "MITRE ATT&CK", category: "Knowledge", desc: "Matrix of adversarial tactics and techniques.", url: "https://attack.mitre.org/" },
                    { name: "ISO/IEC 27001", category: "Standard", desc: "The global gold standard for InfoSec management.", url: "https://www.iso.org/standard/27001" }
                ]
            };

            const checklist = [
                { 
                    step: "Professional Profile Optimization", 
                    detail: "Update LinkedIn with specific labs. Use industry best practices for a high-impact profile.",
                    links: [{ label: "Profile Best Practices", url: "https://www.linkedin.com" }]
                },
                { 
                    step: "Download the Starter Pack", 
                    detail: "Your all-in-one resource for kickstarting your cybersecurity journey.",
                    links: [{ label: "Launch Starter Pack", url: "https://www.canva.com" }]
                }
            ];

            const jobBoards = [
                { name: "ALX Career Page", url: "https://careers.alxafrica.com/", icon: "award" },
                { name: "LinkedIn Jobs", url: "https://www.linkedin.com/jobs/", icon: "linkedin" },
                { name: "NinjaJobs", url: "https://ninjajobs.org/", icon: "zap" },
                { name: "Infosec-Jobs.com", url: "https://infosec-jobs.com/", icon: "lock" }
            ];

            const businessTracks = [
                {
                    tier: 'Phase 1: Knowledge-Based (Freelance)',
                    roles: [
                        { t: 'Bug Bounty Professional', d: 'Hunting for vulnerabilities in public platforms for rewards.' },
                        { t: 'Cyber Content Creator', d: 'Monetizing technical expertise via YouTube, blogs, or newsletters.' },
                        { t: 'Security Awareness Trainer', d: 'Delivering corporate workshops to reduce human-factor risk.' }
                    ]
                }
            ];

            return (
                <div className="min-h-screen relative z-10 flex flex-col bg-slate-50">
                    {/* Header */}
                    <header className="bg-[#002b56] text-white pt-6 pb-12 px-6 text-center relative overflow-hidden shadow-2xl">
                        <div className="absolute top-0 left-0 w-full h-1.5 flex">
                            <div className="flex-1 bg-[#05F283]" />
                            <div className="flex-1 bg-[#564887]" />
                            <div className="flex-1 bg-[#27DEF2]" />
                        </div>
                        <div className="max-w-4xl mx-auto relative z-10 flex flex-col items-center">
                            <h1 className="text-2xl md:text-4xl font-bold tracking-tight text-white">Cybersecurity <span className="text-[#05F283]">Master Portal</span></h1>
                            <p className="text-[10px] md:text-xs text-slate-400 font-bold uppercase tracking-[0.4em] mt-1">TAMBALI >>> READY TO LAUNCH</p>
                        </div>
                    </header>

                    {/* Navigation Bar */}
                    <nav className="max-w-7xl mx-auto -mt-6 px-4 relative z-30 w-full">
                        <div className="bg-white rounded-xl shadow-xl p-1.5 flex flex-wrap gap-1 border border-slate-200 justify-center sm:justify-start">
                            {[
                                { id: 'map', label: 'Career Map', icon: 'trending-up' },
                                { id: 'toolkit', label: 'Security Toolkit', icon: 'wrench' },
                                { id: 'specialties', label: 'Frontier Specialties', icon: 'brain' },
                                { id: 'checklist', label: 'Success Checklist', icon: 'check-square' },
                                { id: 'benchmarks', label: 'Job Boards & Pathfinder', icon: 'briefcase' }
                            ].map((tab) => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-semibold transition-all ${activeTab === tab.id ? 'bg-[#002b56] text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'}`}
                                >
                                    <Icon name={tab.icon} size={14} />
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* Content Display Engine */}
                    <main className="max-w-7xl mx-auto px-4 py-8 flex-1 w-full tab-content">
                        {activeTab === 'map' && (
                            <div className="space-y-6 animate-in">
                                {careerData.map((lvl, idx) => (
                                    <div key={idx} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                        <h3 className="text-base font-bold text-[#002b56]">{lvl.level}</h3>
                                        <p className="text-xs text-slate-400 mb-4">{lvl.desc}</p>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            {lvl.tracks.map((track, tIdx) => (
                                                <div key={tIdx} className={`p-4 rounded-2xl border-2 ${track.color} bg-slate-50/50 flex flex-col justify-between`}>
                                                    <div>
                                                        <div className="flex items-center gap-2 mb-2">
                                                            <Icon name={track.icon} size={15} className="text-[#564887]" />
                                                            <h4 className="font-bold text-xs text-slate-700">{track.name}</h4>
                                                        </div>
                                                        <div className="space-y-1">
                                                            {track.roles.map((role, rIdx) => (
                                                                <RoleItem key={rIdx} title={role.title} desc={role.desc} />
                                                            ))}
                                                        </div>
                                                    </div>
                                                    <div className="mt-4 pt-2 border-t border-slate-200 text-[11px] text-slate-500">
                                                        <strong>Target Certs:</strong> {track.certs}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'toolkit' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 animate-in">
                                {Object.keys(toolkit).map((catName) => (
                                    <div key={catName} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                        <h3 className="text-base font-bold text-[#002b56] mb-4">{catName}</h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            {toolkit[catName].map((tool, tIdx) => (
                                                <a href={tool.url} target="_blank" rel="noreferrer" key={tIdx} className="p-3 rounded-xl border border-slate-100 hover:border-[#05F283] transition-all bg-slate-50 flex flex-col justify-between group">
                                                    <div>
                                                        <div className="flex justify-between items-center mb-1">
                                                            <span className="font-bold text-xs text-slate-700 group-hover:text-[#002b56]">{tool.name}</span>
                                                            <span className="text-[9px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full font-semibold uppercase">{tool.category}</span>
                                                        </div>
                                                        <p className="text-[11px] text-slate-400 leading-normal">{tool.desc}</p>
                                                    </div>
                                                </a>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'specialties' && (
                            <div className="space-y-6 animate-in">
                                {businessTracks.map((phase, pIdx) => (
                                    <div key={pIdx} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                        <h3 className="text-base font-bold text-[#564887] mb-4">{phase.tier}</h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {phase.roles.map((bizRole, rIdx) => (
                                                <div key={rIdx} className="p-4 rounded-xl border border-slate-100 bg-slate-50/30 border-l-4 border-l-[#002b56] standard-card transition-all">
                                                    <h4 className="font-bold text-xs text-[#002b56] mb-1">{bizRole.t}</h4>
                                                    <p className="text-[11px] text-slate-500 leading-relaxed">{bizRole.d}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'checklist' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-in">
                                <div className="lg:col-span-2 space-y-3">
                                    {checklist.map((item, cIdx) => (
                                        <div key={cIdx} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex gap-4 items-start">
                                            <div className="p-2 bg-emerald-50 text-emerald-500 rounded-xl mt-0.5">
                                                <Icon name="check-circle" size={16} />
                                            </div>
                                            <div className="space-y-1 flex-1">
                                                <h4 className="font-bold text-xs text-[#002b56]">{item.step}</h4>
                                                <p className="text-[11px] text-slate-500 leading-relaxed">{item.detail}</p>
                                                <div className="flex flex-wrap gap-2 pt-1">
                                                    {item.links.map((link, lIdx) => (
                                                        <a key={lIdx} href={link.url} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 bg-slate-100 text-slate-600 hover:bg-[#002b56] hover:text-white px-2.5 py-1 rounded text-[10px] font-semibold transition-all">
                                                            {link.label} <Icon name="external-link" size={8} />
                                                        </a>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="bg-gradient-to-br from-[#564887] to-[#002b56] text-white p-6 rounded-3xl shadow-md h-fit">
                                    <h4 className="font-bold text-xs mb-2 flex items-center gap-2">
                                        <Icon name="rocket" size={14} className="text-[#05F283]" /> Operational Baseline
                                    </h4>
                                    <p className="text-[11px] text-slate-300 leading-relaxed">
                                        Complete your primary portfolio blocks first. Stacking live laboratory proof environments generates the fastest corporate recruitment response.
                                    </p>
                                </div>
                            </div>
                        )}

                        {activeTab === 'benchmarks' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-in">
                                <div className="lg:col-span-2 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                    <h3 className="text-base font-bold text-[#002b56] mb-4 flex items-center gap-2">
                                        <Icon name="briefcase" size={16} /> Cyber Ecosystem Job Boards
                                    </h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        {jobBoards.map((jb, jIdx) => (
                                            <a key={jIdx} href={jb.url} target="_blank" rel="noreferrer" className="flex items-center justify-between p-3 rounded-xl border border-slate-100 bg-slate-50 hover:bg-slate-100/80 transition-all group">
                                                <div className="flex items-center gap-3">
                                                    <div className="p-2 bg-slate-200 text-slate-600 group-hover:bg-[#002b56] group-hover:text-white rounded-lg transition-colors">
                                                        <Icon name={jb.icon} size={12} />
                                                    </div>
                                                    <span className="text-xs font-semibold text-slate-700">{jb.name}</span>
                                                </div>
                                                <Icon name="chevron-right" size={12} className="text-slate-400 group-hover:translate-x-0.5 transition-transform" />
                                            </a>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <PathfinderQuiz />
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer Alignment */}
                    <footer className="bg-slate-900 text-slate-500 text-center py-6 text-[10px] border-t border-slate-800 tracking-wider font-semibold">
                        © 2026 ALX CYBERSECURITY CAREER INSIGHT HUB • DEPLOYED THROUGH IN-BROWSER BABEL TRANSCOMPILATION
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
