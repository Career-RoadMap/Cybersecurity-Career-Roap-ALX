                        { text: "Flaws in structural parsing logic to inject unauthorized payloads.", type: "O" },
                        { text: "Licensing agreements, internal access governance logs, and structural checklists.", type: "S" }
                    ]
                },
                {
                    q: "What project scenario sounds most engaging to you?",
                    options: [
                        { text: "Setting up automated SIEM triggers to block automated bot brute-forcing in real time.", type: "D" },

                        { text: "Drafting a localized privacy workflow that adheres strictly to global standards like GDPR/NDPR.", type: "S" }

                },
                {
                    q: "A high-severity zero-day exploit is disclosed globally. What is your action plan?",
                    options: [
                        { text: "Immediately audit system logs to track potential compromises and apply structural patches.", type: "D" },
                        { text: "Analyze the POC code structure to see how it can be bypassed on various frameworks.", type: "O" },
                        { text: "Assess legal vulnerabilities, verify business liabilities, and formulate response communication templates.", type: "S" }
                    ]
                },
                {
                    q: "What is your primary design philosophy for digital environments?",
                    options: [
                        { text: "Zero-Trust: Limit individual authorizations and isolate modular containers completely.", type: "D" },
                        { text: "Assume Compromise: Explore the system from an adversary perspective to identify weak links.", type: "O" },
                        { text: "Process Integrity: Formulate standard procedures and training rules to stop human errors.", type: "S" }
                    ]
                },
                {
                    q: "Which publication or educational track interests you the most?",
                    options: [
                        { text: "Blue Team Handbook and Advanced Defensive Event Correlation techniques.", type: "D" },
                        { text: "Offensive Security Web Exploitation and bypassing cloud firewalls.", type: "O" },
                        { text: "ISO/IEC 27001 Auditor training guides and Data Protection compliance legislation.", type: "S" }
                    ]
                }
            ];

            const handleAnswer = (type) => {
                const newScores = { ...scores, [type]: scores[type] + 1 };
                setScores(newScores);
                if (step < questions.length - 1) {
                    setStep(step + 1);
                } else {
                    const top = Object.keys(newScores).reduce((a, b) => newScores[a] > newScores[b] ? a : b);
                    setResult(top);
                }
            };

            const resetQuiz = () => {
                setScores({ D: 0, O: 0, S: 0 });
                setResult(null);
                setStep(0);
            };

            if (result) {
                return (
                    <div key="quiz-result" className="bg-[#002b56] text-white p-8 rounded-3xl text-center animate-in shadow-xl border border-slate-700">
                        <Icon name="award" size={48} className="mx-auto mb-4 text-[#05F283]" />
                        <h3 className="text-xl font-bold mb-2">Your Career Path:

                        <p className="text-slate-300 text-xs mb-6 leading-relaxed">
                            {result === 'D' ? 'You belong in defensive operations: correlating logs, hunting system anomalies, and hardening corporate structures.' : 
                             result === 'O' ? 'You excel at active exploratory tactics: penetrative auditing, model red teaming, and proving technical impact.' : 
                             'You thrive in governance: implementing compliance, designing standard operating guidelines, and acting as a legal protector.'}

                        <button onClick={resetQuiz} className="text-xs font-bold text-[#05F283] underline uppercase tracking-widest hover:text-white transition-colors">Restart Pathfinder</button>
                    </div>

                                key={i}

                            </button>
                        ))}
