                    options: [

                        { text: "Assess legal vulnerabilities, verify business liabilities, and formulate response communication templates.", type: "S" }
                    ]

                    q: "What is your primary design philosophy for digital environments?",
                    options: [
                        { text: "Zero-Trust: Limit individual authorizations and isolate modular containers completely.", type: "D" },
                        { text: "Assume Compromise: Explore the system from an adversary perspective to identify weak links.", type: "O" },
                        { text: "Process Integrity: Formulate standard procedures and training rules to stop human errors.", type: "S" }

                        { text: "Blue Team Handbook and Advanced Defensive Event Correlation techniques.", type: "D" },

                        { text: "Governance strategies, legal compliance workflows, and digital risk metrics.", type: "S" }
                    ]
                }
            ];

            const handleAnswer = (type) => {
                const newScores = { ...scores, [type]: scores[type] + 1 };
                setScores(newScores);
                if (step < questions.length - 1) {
                    setStep(step + 1);
                } else {
                    const top = Object.keys(newScores).reduce((a, b) => newScores[a] > newScores[b] ? a : b);
                    setResult(top);
                }
            };

            const resetQuiz = () => {
                setScores({ D: 0, O: 0, S: 0 });
                setResult(null);
                setStep(0);
            };

            if (result) {
                return (
                    <div key="quiz-result" className="bg-[#002b56] text-white p-8 rounded-3xl text-center animate-in shadow-xl">

                    </div>
                );

                            Career Pathfinder Engine
                        </h3>

                    </div>
                    <p className="text-xs font-semibold text-slate-700 mb-4 leading-relaxed">{questions[step].q}</p>

                            >

                            </button>

                                <div className="lg:col-span-2 space-y-4">
                                    
                                    {/* Interactive Progress Meter */}
                                    <div className="bg-[#002b56] text-white p-5 rounded-2xl shadow-md border border-slate-800">
                                        <div className="flex justify-between items-center mb-2">
                                            <h4 className="font-bold text-xs tracking-wider text-[#05F283] uppercase">Interactive Progress Tracker</h4>
                                            <span className="text-xs font-bold">{progressPercent}% Completed</span>
                                        </div>
                                        <div className="w-full bg-slate-800 rounded-full h-2">
                                            <div className="bg-[#05F283] h-2 rounded-full transition-all duration-500" style={{ width: `${progressPercent}%` }} />
                                        </div>
                                        <p className="text-[10px] text-slate-300 mt-2 italic leading-relaxed">
                                            {progressPercent === 100 ? "🎉 Congratulations! You have fully set up your portfolio foundations. You are ready to launch!" : "Check off items below as you execute them to track your progress in real-time."}
                                        </p>
                                    </div>

                                    {checklist.map((item, cIdx) => (
                                        <div key={cIdx} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex gap-4 items-start">
                                            <div className="p-2 bg-emerald-50 text-emerald-500 rounded-xl mt-0.5">
                                                <Icon name="check-circle" size={18} />
                                            </div>
                                            <div className="space-y-3 flex-1">
                                                <div>
                                                    <h4 className="font-bold text-xs md:text-sm text-[#002b56]">{item.step}</h4>
                                                    <p className="text-[11px] md:text-xs text-slate-500 leading-relaxed mt-0.5">{item.detail}</p>
                                                </div>

                                                {/* Sub-tasks interactive checklist section */}
                                                <div className="p-3 bg-slate-50/80 rounded-xl border border-slate-100 space-y-2">
                                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block">Action Items:</span>
                                                    {item.subtasks.map((sub, sIdx) => {
                                                        const taskKey = `${item.step}-${sIdx}`;
                                                        const isChecked = checkedSubtasks[taskKey] || false;
                                                        return (
                                                            <div key={sIdx} className="flex items-start gap-2.5 py-1">
                                                                <input 
                                                                    type="checkbox" 
                                                                    id={taskKey} 
                                                                    checked={isChecked} 
                                                                    onChange={() => handleSubtaskToggle(taskKey)}
                                                                    className="mt-0.5 h-3.5 w-3.5 rounded border-slate-300 text-[#002b56] focus:ring-[#002b56] cursor-pointer"
                                                                />
                                                                <label 
                                                                    htmlFor={taskKey} 
                                                                    className={`text-[10px] md:text-[11px] font-medium leading-tight cursor-pointer transition-colors ${isChecked ? 'text-slate-400 line-through' : 'text-slate-600'}`}
                                                                >
                                                                    {sub}
                                                                </label>
                                                            </div>
                                                        );
                                                    })}
                                                </div>

                                                <a href={item.url} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1.5 bg-slate-100 text-slate-600 hover:bg-[#002b56] hover:text-white px-2.5 py-1 rounded text-[10px] font-semibold transition-all">
                                                    {item.resource || "View Resource Link"} <Icon name="external-link" size={8} />
                                                </a>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                
                                {/* Right Hand Blueprint Overviews */}
                                <div className="space-y-6">
                                    <div className="bg-gradient-to-br from-[#564887] to-[#002b56] text-white p-6 rounded-3xl shadow-md h-fit">
                                        <h4 className="font-bold text-xs mb-2 flex items-center gap-2 uppercase tracking-wider text-[#05F283]">
                                            <Icon name="rocket" size={14} /> Operational Baseline
                                        </h4>
                                        <p className="text-[11px] text-slate-300 leading-relaxed">
                                            Start with home projects first. Simulating realistic corporate IT environments on local virtualization configurations is the fastest way to demonstrate practical knowledge to employers.
                                        </p>
                                    </div>
                                    <div className="bg-slate-900 text-white p-6 rounded-3xl shadow-md h-fit border border-slate-800">
                                        <h4 className="font-bold text-xs mb-3 uppercase tracking-wider text-teal-400 flex items-center gap-1.5">
                                            <Icon name="book" size={14} /> Home Lab Blueprints
                                        </h4>
                                        <ul className="space-y-2.5 text-[11px] text-slate-300">
                                            <li className="flex gap-2"><Icon name="chevron-right" size={10} className="text-[#05F283] mt-1 shrink-0" /> Host Metasploitable targets internally.</li>
                                            <li className="flex gap-2"><Icon name="chevron-right" size={10} className="text-[#05F283] mt-1 shrink-0" /> Set up an active Active Directory Domain Services environment.</li>
                                            <li className="flex gap-2"><Icon name="chevron-right" size={10} className="text-[#05F283] mt-1 shrink-0" /> Use Wazuh SIEM to analyze host security events.</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Tab 5: Job Boards & Pathfinder */}
                        {activeTab === 'benchmarks' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-in">
                                <div className="lg:col-span-2 space-y-6">
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                        <h3 className="text-base font-bold text-[#002b56] mb-4 flex items-center gap-2">
                                            <Icon name="briefcase" size={16} /> Cyber Ecosystem Jobs Directories
                                        </h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            {jobBoards.map((jb, jIdx) => (
                                                <a key={jIdx} href={jb.url} target="_blank" rel="noreferrer" className="flex items-center justify-between p-3 rounded-xl border border-slate-100 bg-slate-50 hover:bg-slate-100/80 transition-all group">
                                                    <div className="flex items-center gap-3">
                                                        <div className="p-2 bg-slate-100 text-slate-600 rounded-lg group-hover:bg-[#002b56] group-hover:text-white transition-colors">
                                                            <Icon name={jb.icon} size={14} />
                                                        </div>
                                                        <h4 className="font-bold text-xs text-[#002b56]">{jb.name}</h4>
                                                    </div>
                                                    <Icon name="chevron-right" size={12} className="text-slate-400 group-hover:translate-x-0.5 transition-transform" />
                                                </a>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Local Business Reality Notice */}
                                    <div className="bg-slate-900 text-slate-100 p-6 rounded-3xl border border-slate-800 relative overflow-hidden">
                                        <div className="absolute top-0 right-0 w-32 h-32 bg-indigo-500 opacity-5 rounded-full -mr-16 -mt-16"></div>
                                        <h4 className="font-bold text-xs text-indigo-400 mb-2 uppercase tracking-widest flex items-center gap-1.5">
                                            <Icon name="alert-circle" size={14} /> Local Ecosystem Realities
                                        </h4>
                                        <p className="text-[11px] text-slate-400 leading-relaxed">
                                            While remote global opportunities allow for direct USD compensation structures, local business benchmarks remain tied to regional guidelines. Less than 5% of regional tech organizations pay above ₦15 million annually, even at director or executive levels. The vast majority of mid-to-senior security operations roles scale reliably within the ₦5M - ₦8M range.
                                        </p>
                                    </div>
                                </div>
                                <div>
                                    <PathfinderQuiz />
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer Alignment */}
                    <footer className="bg-slate-900 text-slate-500 text-center py-6 text-[10px] border-t border-slate-800 tracking-wider font-semibold relative z-10">
                        &copy; 2026 ALX CYBERSECURITY CAREER INSIGHT HUB &bull; REGIONAL ECOSYSTEM &amp; STRATEGY PORTAL
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
